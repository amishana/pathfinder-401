<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Profile — Viterbi Pathfinder</title>
<link rel="stylesheet" href="theme.css">
<style>
  :root{
    --active-dot:var(--cardinal);
    --closeout-dot:#B86E00;
    --closed-dot:var(--faint);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--active-dot:var(--gold);--closeout-dot:#E8925A;}
  }
  :root[data-theme="dark"]{--active-dot:var(--gold);--closeout-dot:#E8925A;}
  .band{--active-dot:var(--gold);--closeout-dot:var(--sand);}

  .back-link{display:inline-flex;align-items:center;gap:8px;}
  .back-link:hover svg{transform:translateX(-3px);}
  .back-link svg{transition:transform .15s;}

  /* breadcrumb */
  .crumb-strip{border-bottom:1px solid var(--line);padding:12px 0;}
  .crumb{display:flex;align-items:center;gap:10px;color:var(--muted);}
  .crumb a:hover{color:var(--ink);}
  .crumb .sep{color:var(--faint);}
  .crumb #crumb-name{color:var(--ink);}

  /* hero band with the name */
  .profile-hero{padding-top:clamp(48px,8vw,104px);padding-bottom:clamp(40px,6vw,72px);}
  .profile-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,3vw,36px);align-items:end;margin-top:28px;}
  .avatar{
    width:clamp(72px,9vw,112px);height:clamp(72px,9vw,112px);border-radius:50%;
    background:var(--hot);color:var(--hot-ink);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:clamp(16px,2vw,22px);letter-spacing:.06em;
  }
  .head-body h1{font-size:clamp(48px,7.5vw,104px);}
  .head-meta{
    margin-top:clamp(28px,4vw,48px);padding-top:20px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px 40px;
  }
  .head-meta .k{display:block;margin-bottom:6px;color:var(--faint);}
  .head-dept{font-size:15px;line-height:1.45;}
  .courtesy-list{font-size:14px;color:var(--muted);line-height:1.45;}
  .head-email a{color:var(--accent);font-size:15px;}
  .head-email a:hover{text-decoration:underline;}

  /* page layout */
  .profile-page{padding:clamp(48px,7vw,88px) var(--gutter) clamp(72px,9vw,120px);}
  .profile-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(32px,6vw,88px);align-items:start;}
  #main-col{counter-reset:sec;}

  /* sections get numbered mono eyebrows */
  .section{margin-bottom:clamp(48px,6vw,72px);}
  .section-label{
    counter-increment:sec;
    display:flex;align-items:center;gap:10px;margin-bottom:20px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  }
  .section-label::before{content:"[ " counter(sec,decimal-leading-zero) " ]";color:var(--ink);}
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}

  /* research summary: big editorial lede */
  .summary-text{
    font-family:var(--serif);font-size:clamp(24px,2.6vw,32px);line-height:1.25;letter-spacing:-.005em;
    max-width:30ch;margin:0 0 36px;
  }
  @media (min-width:1000px){.summary-text{max-width:36ch;}}

  .tag-group{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line);}
  .tag-group-label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding-top:5px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-size:13px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 12px;white-space:nowrap;
  }

  /* publications */
  .pub-tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line-strong);border-radius:999px;margin-bottom:12px;}
  .pub-tab{
    background:none;border:none;border-radius:999px;padding:7px 16px;color:var(--muted);
    font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  }
  .pub-tab.active{background:var(--ink);color:var(--bg);}
  .pub-tab:hover:not(.active){color:var(--ink);}
  .pub-list{display:none;}
  .pub-list.active{display:block;}

  .pub-item,.honor-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--line);}
  .pub-year,.honor-year{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--faint);padding-top:3px;font-variant-numeric:tabular-nums;}
  .pub-title{font-size:16px;line-height:1.4;}
  .pub-title a:hover{color:var(--accent);}
  .pub-venue{margin-top:4px;font-size:13.5px;color:var(--muted);font-style:italic;}
  .pub-cite{margin-top:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);}
  .pub-doi{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--accent);}
  .pub-doi:hover{text-decoration:underline;}
  .honor-text{font-size:16px;}

  /* awards */
  .award-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--line);}
  .award-status-dot{width:10px;height:10px;border-radius:50%;margin-top:7px;}
  .award-status-dot.active{background:var(--active-dot);}
  .award-status-dot.closeout{background:var(--closeout-dot);}
  .award-status-dot.closed{background:var(--closed-dot);}
  .award-title{font-size:16px;line-height:1.4;}
  .award-meta{margin-top:4px;font-size:13.5px;color:var(--muted);}
  .award-amount{margin-top:6px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--faint);font-variant-numeric:tabular-nums;}
  .award-status-tag{
    display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;vertical-align:middle;
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;
  }
  .award-status-tag.active{color:var(--active-dot);}
  .award-status-tag.closeout{color:var(--closeout-dot);}
  .award-status-tag.closed{color:var(--faint);}

  /* patents */
  .patent-item{padding:18px 0;border-bottom:1px solid var(--line);}
  .patent-title{font-size:16px;line-height:1.4;}
  .patent-meta{margin-top:4px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);}
  .patent-link{display:inline-block;margin-top:6px;font-size:13px;color:var(--accent);}
  .patent-link:hover{text-decoration:underline;}

  /* sidebar */
  .sidebar{position:sticky;top:96px;}
  .sidebar-block{margin-bottom:36px;}
  .sidebar-block h4{
    margin:0 0 4px;font-family:var(--mono);font-size:11.5px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  }
  .link-item{
    display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;
  }
  .link-item:first-of-type{border-top:1px solid var(--line-strong);}
  .link-item svg{flex:none;margin-top:4px;opacity:.55;}
  .link-item:hover{color:var(--accent);}
  .link-item:hover svg{opacity:1;}
  .link-label{display:block;line-height:1.3;}
  .link-type{display:block;margin-top:3px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}

  /* funding summary is a sand-on-night stat card */
  .funding-card{padding:22px;border-radius:4px;border:1px solid var(--line);}
  .funding-card h4{color:var(--muted);}
  .funding-total{font-family:var(--serif);font-size:48px;line-height:1;margin:14px 0 6px;}
  .funding-sub{font-size:13px;color:var(--muted);}
  .funding-dots{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13px;}
  .funding-dots .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;}

  .error-box{padding-top:clamp(56px,8vw,104px);padding-bottom:clamp(56px,8vw,104px);}
  .error-box h2{margin-top:24px;font-size:clamp(36px,5vw,64px);max-width:18ch;}
  .error-box p{margin-top:16px;color:var(--muted);}

  @media (max-width:860px){
    .profile-grid{grid-template-columns:1fr;}
    .sidebar{position:static;}
  }
  @media (max-width:560px){
    .profile-head{grid-template-columns:1fr;}
    .tag-group{grid-template-columns:1fr;gap:8px;}
    .pub-item,.honor-item,.award-item{grid-template-columns:48px minmax(0,1fr);}
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-row">
    <div class="brand"><a href="Viterbi_Pathfinder_POC.html"><span class="mark">Viterbi</span> Pathfinder<span class="dot"></span></a></div>
    <a href="Viterbi_Pathfinder_POC.html" class="btn back-link">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M9 11L5 7l4-4"/>
      </svg>
      Back to search
    </a>
  </div>
</header>

<div class="band">
  <div class="crumb-strip">
    <div class="wrap">
      <div class="crumb mono">
        <a href="Viterbi_Pathfinder_POC.html">Search</a>
        <span class="sep">/</span>
        <span id="crumb-name">Loading…</span>
      </div>
    </div>
  </div>
  <div class="wrap profile-hero" id="profile-hero" style="display:none;"></div>
</div>

<div id="profile-error" class="wrap error-box" style="display:none;">
  <div class="eyebrow"><span class="num">[ ! ]</span> Profile unavailable</div>
  <h2>Could not load this <em>faculty profile</em>.</h2>
  <p>Make sure the API is running.</p>
</div>

<div class="wrap profile-page" id="profile-page" style="display:none;">
  <div class="profile-grid">

    <div id="main-col"></div>
    <aside class="sidebar" id="sidebar-col"></aside>
  </div>
</div>

<script>
  const API_BASE = 'http://127.0.0.1:8000';

  function esc(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
  function initials(name){ return (name||'').split(' ').map(w=>w.replace(/[^A-Za-z]/g,'')).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

  function linkIcon(type){
    if(type==='official_profile') return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="12" height="12" rx="1"/><path d="M4 4h6M4 7h6M4 10h3"/></svg>';
    if(type==='lab') return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="6"/><path d="M7 1c-1.5 2-2.5 3.5-2.5 6s1 4 2.5 6M7 1c1.5 2 2.5 3.5 2.5 6s-1 4-2.5 6M1 7h12"/></svg>';
    if(type==='google_scholar') return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 1L1 5l6 4 6-4-6-4z"/><path d="M1 5v4M11 6v4a4 4 0 01-8 0V6"/></svg>';
    return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2h8M3 5h8M3 8h5"/></svg>';
  }

  function linkLabel(type){
    return {official_profile:'USC Viterbi faculty page',lab:'Lab website',google_scholar:'Google Scholar',recent_publications:'Recent publications'}[type] || type;
  }
  function linkSubtitle(type){
    return {official_profile:'Official profile',lab:'Lab website',google_scholar:'Publication record',recent_publications:'Sorted by date'}[type] || '';
  }

  function awardStatusClass(status){
    if(!status) return 'closed';
    const s = status.toLowerCase();
    if(s.includes('active')) return 'active';
    if(s.includes('closeout')) return 'closeout';
    return 'closed';
  }
  function awardStatusLabel(status){
    const cls = awardStatusClass(status);
    return {active:'Active',closeout:'In closeout',closed:'Closed'}[cls];
  }

  function formatUSD(n){ if(!n) return ''; return '$'+Number(n).toLocaleString(); }
  function formatDate(d){ if(!d) return ''; return d.slice(0,7).replace('-','/'); }

  function renderTags(items, label){
    if(!items||!items.length) return '';
    return `<div class="tag-group"><div class="tag-group-label">${esc(label)}</div><div class="tags">${items.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>`;
  }

  function renderPubs(records, views){
    if(!records||!records.length) return '';
    const byId = {};
    records.forEach(p=>{ if(p.title) byId[p.title]=p; });

    const recentIds = (views||{}).recent_publication_ids || [];
    const citedIds  = (views||{}).most_cited_publication_ids || [];

    // fallback: if no views, show all as recent
    const recentPubs = recentIds.length
      ? recentIds.map(id=>records.find(p=>p.publication_id===id||p.title===id||p.publication_link===id||p.doi===id)).filter(Boolean)
      : records.slice(0,8);
    const citedPubs  = citedIds.length
      ? citedIds.map(id=>records.find(p=>p.publication_id===id||p.title===id||p.publication_link===id||p.doi===id)).filter(Boolean)
      : [];

    function pubItem(p){
      const link = p.publication_link || (p.doi ? `https://doi.org/${p.doi}` : null);
      const title = link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title);
      const cite = (p.citation_snapshot||{}).count ? `<div class="pub-cite">${esc(String(p.citation_snapshot.count))} citations</div>` : '';
      const doi  = p.doi ? `<a class="pub-doi" href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">${esc(p.doi)} ↗</a>` : '';
      return `<div class="pub-item"><div class="pub-year">${esc(String(p.publication_year||''))}</div><div class="pub-body"><div class="pub-title">${title}</div>${p.venue?`<div class="pub-venue">${esc(p.venue)}</div>`:''}${cite}${doi}</div></div>`;
    }

    const hasCited = citedPubs.length > 0;
    return `<div class="section"><div class="section-label">Publications</div>
      <div class="pub-tabs">
        <button class="pub-tab active" onclick="setPubTab('recent',this)">Recent</button>
        ${hasCited?'<button class="pub-tab" onclick="setPubTab(\'cited\',this)">Most cited</button>':''}
      </div>
      <div class="pub-list active" id="pub-recent">${recentPubs.map(pubItem).join('')}</div>
      ${hasCited?`<div class="pub-list" id="pub-cited">${citedPubs.map(pubItem).join('')}</div>`:''}
    </div>`;
  }

  function renderAwards(awards){
    const records = (awards||{}).records || [];
    if(!records.length) return '';
    return `<div class="section"><div class="section-label">Research funding</div>${records.map(a=>{
      const cls = awardStatusClass(a.status);
      const lbl = awardStatusLabel(a.status);
      const meta = [a.sponsor, a.grant_number].filter(Boolean).join(' · ');
      const dates = [formatDate(a.start_date), formatDate(a.end_date)].filter(Boolean).join(' – ');
      const amount = a.obligated_total_usd ? formatUSD(a.obligated_total_usd) : '';
      const amountLine = [amount, dates].filter(Boolean).join(' · ');
      return `<div class="award-item"><div class="award-status-dot ${cls}"></div><div class="award-body">
        <div class="award-title">${esc(a.title)} <span class="award-status-tag ${cls}">${lbl}</span></div>
        ${meta?`<div class="award-meta">${esc(meta)}</div>`:''}
        ${amountLine?`<div class="award-amount">${esc(amountLine)}</div>`:''}
      </div></div>`;
    }).join('')}</div>`;
  }

  function renderHonors(honors){
    if(!honors||!honors.length) return '';
    return `<div class="section"><div class="section-label">Honors &amp; awards</div>${honors.map(h=>`
      <div class="honor-item"><div class="honor-year">${esc(String(h.year||''))}</div><div class="honor-text">${esc(h.honor)}</div></div>
    `).join('')}</div>`;
  }

  function renderPatents(patents){
    if(!patents||!patents.length) return '';
    return `<div class="section"><div class="section-label">Patents &amp; inventions</div>${patents.map(p=>{
      const meta = [p.jurisdiction_identifier, p.status, p.event_date ? p.event_date.slice(0,7) : null].filter(Boolean).join(' · ');
      const link = p.public_link ? `<a class="patent-link" href="${esc(p.public_link)}" target="_blank" rel="noopener">View patent ↗</a>` : '';
      return `<div class="patent-item"><div class="patent-title">${esc(p.title)}</div>${meta?`<div class="patent-meta">${esc(meta)}</div>`:''}${link}</div>`;
    }).join('')}</div>`;
  }

  function renderFundingSummary(awards){
    const records = (awards||{}).records || [];
    if(!records.length) return '';
    const total = records.reduce((s,a)=>s+(a.obligated_total_usd||0),0);
    const active = records.filter(a=>awardStatusClass(a.status)==='active').length;
    const closeout = records.filter(a=>awardStatusClass(a.status)==='closeout').length;
    const dot = (cls,label)=>`<span><span class="d" style="background:var(--${cls}-dot);"></span>${label}</span>`;
    const dots = [
      active?dot('active',`${active} active award${active!==1?'s':''}`):'',
      closeout?dot('closeout',`${closeout} in closeout`):'',
    ].join('');
    return `<div class="sidebar-block band funding-card"><h4>Funding summary</h4>
      <div class="funding-total">${formatUSD(total)}</div>
      <div class="funding-sub">Total across ${records.length} award${records.length!==1?'s':''}</div>
      ${dots?`<div class="funding-dots">${dots}</div>`:''}
    </div>`;
  }

  async function loadProfile(){
    const params = new URLSearchParams(location.search);
    const facultyId = params.get('id');
    if(!facultyId){
      document.getElementById('crumb-name').textContent = 'Profile not found';
      document.getElementById('profile-error').style.display='block';
      return;
    }

    let pkg;
    try{
      const res = await fetch(`${API_BASE}/faculty/${encodeURIComponent(facultyId)}`);
      if(!res.ok) throw new Error(res.status);
      pkg = await res.json();
    }catch(e){
      document.getElementById('crumb-name').textContent = facultyId;
      document.getElementById('profile-error').style.display='block';
      return;
    }

    const identity = pkg.identity || {};
    const name = identity.canonical_name || facultyId;
    document.title = `${name} — Viterbi Pathfinder`;
    document.getElementById('crumb-name').textContent = name;

    // primary appointment
    const appts = identity.appointments || [];
    const primary = appts.find(a=>a.appointment_type==='primary') || appts[0] || {};
    const courtesy = appts.filter(a=>a.appointment_type==='courtesy');

    // header, rendered into the dark hero band
    const research = pkg.research || {};
    const deptLines = [primary.title, primary.unit].filter(Boolean).map(esc).join('<br>');
    const hero = document.getElementById('profile-hero');
    hero.innerHTML = `
      <div class="eyebrow"><span class="num">[ ${esc(facultyId)} ]</span> Faculty profile</div>
      <div class="profile-head">
        <div class="avatar">${esc(initials(name))}</div>
        <div class="head-body"><h1>${esc(name)}</h1></div>
      </div>
      <div class="head-meta">
        ${deptLines?`<div><span class="k mono">Appointment</span><div class="head-dept">${deptLines}</div></div>`:''}
        ${courtesy.length?`<div><span class="k mono">Courtesy</span><div class="courtesy-list">${courtesy.map(c=>esc(c.unit)).join('<br>')}</div></div>`:''}
        ${identity.usc_email?`<div><span class="k mono">Contact</span><div class="head-email"><a href="mailto:${esc(identity.usc_email)}">${esc(identity.usc_email)}</a></div></div>`:''}
      </div>
    `;
    hero.style.display='block';

    const mainCol = document.getElementById('main-col');
    mainCol.innerHTML = `
      ${research.summary?`<div class="section"><div class="section-label">Research summary</div><p class="summary-text">${esc(research.summary)}</p>
        ${renderTags(research.domains,'Research domains')}
        ${renderTags(research.methods,'Methods')}
        ${renderTags(research.applications,'Applications')}
      </div>`:''}

      ${renderPubs(pkg.publications?.records, pkg.publications?.views)}
      ${renderAwards(pkg.awards)}
      ${renderHonors(pkg.honors)}
      ${renderPatents(pkg.patents_and_inventions)}
    `;

    // sidebar
    const links = pkg.links || [];
    const sidebar = document.getElementById('sidebar-col');
    sidebar.innerHTML = `
      ${links.length?`<div class="sidebar-block"><h4>Links</h4>${links.map(l=>`
        <a href="${esc(l.url)}" class="link-item" target="_blank" rel="noopener">
          ${linkIcon(l.link_type)}
          <div class="link-item-body">
            <span class="link-label">${esc(linkLabel(l.link_type))}</span>
            <span class="link-type">${esc(linkSubtitle(l.link_type))}</span>
          </div>
        </a>`).join('')}</div>`:''}
      ${renderFundingSummary(pkg.awards)}
    `;

    document.getElementById('profile-page').style.display='block';
  }

  function setPubTab(tab, btn){
    document.querySelectorAll('.pub-list').forEach(l=>l.classList.remove('active'));
    document.querySelectorAll('.pub-tab').forEach(b=>b.classList.remove('active'));
    const el = document.getElementById('pub-'+tab);
    if(el) el.classList.add('active');
    btn.classList.add('active');
  }

  loadProfile();
</script>

</body>
</html>
