services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: faculty_search
      POSTGRES_USER: faculty
      POSTGRES_PASSWORD: faculty
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # only runs on first boot (empty volume). see README for how to reset.
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faculty -d faculty_search"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
